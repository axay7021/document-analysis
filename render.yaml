# Free evaluation deployment requested by the owner. Local data is ephemeral.
services:
  - type: web
    name: document-analysis-api
    runtime: node
    repo: https://github.com/axay7021/document-analysis
    branch: main
    region: oregon
    plan: free
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm rebuild faiss-node bcrypt && pnpm build && node -e "const {IndexFlatIP}=require('faiss-node'); new IndexFlatIP(3)"
    startCommand: pnpm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: DATA_STORAGE_PATH
        value: ./data/storage
      - key: FAISS_INDEX_PATH
        value: ./data/faiss
      - key: UPLOAD_STORAGE_PATH
        value: ./uploads/documents
      - key: FRONTEND_URL
        sync: false
